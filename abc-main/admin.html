<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>THOR ADMIN</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

<div class="admin-page">

    <!-- ==================== ADMIN LOGIN ==================== -->

    <div
        id="adminLogin"
        class="admin-card"
    >

        <h1>THOR ADMIN</h1>

        <p class="admin-subtitle">
            Quản lý nhân viên
        </p>

        <input
            id="adminEmail"
            type="email"
            autocomplete="username"
            placeholder="Email Admin"
        >

        <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Mật khẩu"
        >

        <button
            id="adminLoginButton"
            type="button"
        >
            Đăng nhập
        </button>

        <div
            id="adminLoginMessage"
            class="login-message"
        ></div>

    </div>


    <!-- ==================== ADMIN PANEL ==================== -->

    <div
        id="adminPanel"
        class="admin-card hidden"
    >

        <div class="admin-title">

            <h1>
                Quản lý nhân viên
            </h1>

            <button
                id="adminLogout"
                type="button"
                class="button-gray"
            >
                Đăng xuất
            </button>

        </div>


        <!-- ==================== FORM NHÂN VIÊN ==================== -->

        <div class="admin-form">

            <h2>
                Thêm / sửa nhân viên
            </h2>

            <input
                id="employeeId"
                type="text"
                autocomplete="off"
                placeholder="Mã nhân viên"
            >

            <input
                id="employeeName"
                type="text"
                autocomplete="off"
                placeholder="Tên nhân viên"
            >

            <select id="employeeRole">

                <option value="user">
                    User
                </option>

                <option value="admin">
                    Admin
                </option>

            </select>


            <label for="startDate">
                Ngày bắt đầu
            </label>

            <input
                id="startDate"
                type="datetime-local"
            >


            <label for="endDate">
                Ngày hết hạn
            </label>

            <input
                id="endDate"
                type="datetime-local"
            >


            <select id="employeeColor">

                <option value="yellow">
                    Vàng
                </option>

                <option value="green">
                    Xanh
                </option>

            </select>


            <div class="admin-form-buttons">

                <button
                    id="saveUser"
                    type="button"
                    class="button-green"
                >
                    Lưu nhân viên
                </button>

                <button
                    id="clearForm"
                    type="button"
                    class="button-gray"
                >
                    Xóa form
                </button>

            </div>

        </div>


        <!-- ==================== DANH SÁCH ==================== -->

        <h2>
            Danh sách nhân viên
        </h2>

        <div
            id="usersList"
            class="users-list"
        >
            Đang tải...
        </div>

    </div>

</div>


<!-- ==================== JAVASCRIPT ==================== -->

<script
    type="module"
    src="./admin.js"
></script>

</body>
</html>
