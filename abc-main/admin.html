<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>Quản lý nhân viên</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body class="admin-body">


<div class="admin-page">


    <!-- ==========================================
         ADMIN LOGIN
    =========================================== -->

    <div
        id="adminLogin"
        class="admin-card"
    >

        <h1>
            Quản lý nhân viên
        </h1>


        <p class="admin-subtitle">
            Đăng nhập quản trị
        </p>


        <input
            id="adminEmail"
            type="email"
            placeholder="Email Admin"
            autocomplete="username"
        >


        <input
            id="adminPassword"
            type="password"
            placeholder="Mật khẩu"
            autocomplete="current-password"
        >


        <button
            id="adminLoginButton"
            class="button-green"
            type="button"
        >
            Đăng nhập
        </button>


        <div
            id="adminLoginMessage"
            class="login-message"
        ></div>

    </div>



    <!-- ==========================================
         ADMIN PANEL
    =========================================== -->

    <div
        id="adminPanel"
        class="admin-card hidden"
    >


        <div class="admin-title">

            <h1>
                Quản lý nhân viên
            </h1>


            <button
                id="adminLogout"
                class="button-gray"
                type="button"
            >
                Đăng xuất
            </button>

        </div>



        <!-- ======================================
             FORM
        ======================================= -->

        <div class="admin-form">

            <h2>
                Thêm / sửa nhân viên
            </h2>


            <input
                id="employeeId"
                placeholder="Mã nhân viên"
                autocomplete="off"
                autocapitalize="characters"
            >


            <input
                id="employeeName"
                placeholder="Tên nhân viên"
                autocomplete="off"
            >


            <select id="employeeRole">

                <option value="user">
                    User
                </option>

                <option value="admin">
                    Admin
                </option>

            </select>


            <label>
                Ngày bắt đầu
            </label>


            <input
                id="startDate"
                type="datetime-local"
            >


            <label>
                Ngày hết hạn
            </label>


            <input
                id="endDate"
                type="datetime-local"
            >


            <select id="employeeColor">

                <option value="yellow">
                    Vàng
                </option>

                <option value="green">
                    Xanh
                </option>

            </select>


            <div class="admin-form-buttons">

                <button
                    id="saveUser"
                    class="button-green"
                    type="button"
                >
                    Lưu nhân viên
                </button>


                <button
                    id="clearForm"
                    class="button-gray"
                    type="button"
                >
                    Xóa form
                </button>

            </div>

        </div>



        <!-- ======================================
             USER LIST
        ======================================= -->

        <h2>
            Danh sách nhân viên
        </h2>


        <div
            id="usersList"
            class="users-list"
        >
            Đang tải...
        </div>


    </div>


</div>



<script
    type="module"
    src="./admin.js"
></script>


</body>

</html>
