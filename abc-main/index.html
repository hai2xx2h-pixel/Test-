<!DOCTYPE html>
<html
    lang="zh"
    class="app-booting"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >


    <!-- =================================================
         iPHONE / PWA
    ================================================== -->

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="员工码"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="theme-color"
        content="#e3e4e9"
    >


    <!-- =================================================
         BOOT
         Ẩn trang trong lúc app khôi phục phiên
    ================================================== -->

    <style>

        html.app-booting,
        html.app-booting body {

            visibility: hidden;

        }

    </style>


    <!-- =================================================
         QR CODE
         GIỮ NGUYÊN
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"
    ></script>


    <!-- =================================================
         APP ICON
    ================================================== -->

    <link
        rel="apple-touch-icon"
        href="icon.png"
    >


    <!-- =================================================
         STYLES
    ================================================== -->

    <link
        rel="stylesheet"
        href="styles.css"
    >


    <!-- =================================================
         TÊN ỨNG DỤNG
    ================================================== -->

    <title>员工码</title>

</head>


<body>


    <!-- =================================================
         LOGIN SCREEN
    ================================================== -->

    <div
        id="loginScreen"
        class="login-screen"
    >

        <div class="login-box">


            <img
                src="Logo.jpg"
                class="login-logo"
                alt="Logo"
            >


            <div class="login-title">
                THOR
            </div>


            <div class="login-subtitle">
                员工身份验证
            </div>


            <input
                id="employeeCodeInput"
                class="employee-input"
                type="text"
                placeholder="请输入员工编号"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
            >


            <button
                id="loginButton"
                class="login-button"
                type="button"
            >
                确认
            </button>


            <div
                id="loginMessage"
                class="login-message"
            ></div>


        </div>

    </div>



    <!-- =================================================
         MAIN APP
    ================================================== -->

    <div
        id="appScreen"
        class="app-screen hidden"
    >


        <!-- =================================================
             EMPLOYEE HEADER
        ================================================== -->

        <div
            class="header"
            id="employeeHeader"
        >
            --
        </div>



        <!-- =================================================
             QR CARD
        ================================================== -->

        <div class="card">


            <!-- CARD HEADER -->

            <div
                class="card-header"
                id="cardHeader"
            >

                <span id="headerText">
                    将二维码对准扫描器刷码出场
                </span>


                <div class="circle1"></div>

                <div class="circle2"></div>

            </div>



            <!-- CARD BODY -->

            <div class="card-body">


                <!-- =================================================
                     CURRENT TIME
                ================================================== -->

                <div
                    class="time"
                    id="currentTime"
                >
                    --
                </div>



                <!-- =================================================
                     QR CODE
                ================================================== -->

                <div
                    id="qrcode"
                ></div>



                <!-- =================================================
                     REFRESH QR
                ================================================== -->

                <div class="refresh">

                    <span
                        id="refreshQRCode"
                        class="refresh-title"
                        role="button"
                    >
                        刷新二维码
                    </span>

                </div>



                <!-- =================================================
                     STATUS / TIMER
                ================================================== -->

                <div class="status-box">


                    <div class="status-label">
                        已生效
                    </div>


                    <div
                        class="status-timer"
                        id="statusTimer"
                    >
                        00:00:00
                    </div>


                </div>


            </div>

        </div>



        <!-- =================================================
             NOTE
        ================================================== -->

        <div class="note">

           尊敬的员工您好，您已进入企业涉密区<br>
    域，出于企业安全考虑，您的手机摄像头将被<br>
    禁止拍摄，感谢您的配合。

        </div>


    </div>



    <!-- =================================================
         BOOTSTRAP
         
         Nếu đã có employeeId:
         tạm thời hiện APP.
         
         app.js sẽ kiểm tra Firebase phía sau.
    ================================================== -->

    <script>

        (function () {

            try {

                const EMPLOYEE_KEY =
                    "thor_employee_id";


                const savedEmployee =
                    localStorage.getItem(
                        EMPLOYEE_KEY
                    );


                const loginScreen =
                    document.getElementById(
                        "loginScreen"
                    );


                const appScreen =
                    document.getElementById(
                        "appScreen"
                    );


                /*
                 * Không có mạng
                 */

                if (
                    !navigator.onLine
                ) {

                    loginScreen.classList.remove(
                        "hidden"
                    );

                    appScreen.classList.add(
                        "hidden"
                    );

                }


                /*
                 * Đã có employee
                 */

                else if (
                    savedEmployee
                ) {

                    loginScreen.classList.add(
                        "hidden"
                    );

                    appScreen.classList.remove(
                        "hidden"
                    );

                }


                /*
                 * Chưa đăng nhập
                 */

                else {

                    loginScreen.classList.remove(
                        "hidden"
                    );

                    appScreen.classList.add(
                        "hidden"
                    );

                }


            } catch (error) {

                console.error(
                    "BOOT ERROR:",
                    error
                );


                /*
                 * Fallback an toàn
                 */

                const loginScreen =
                    document.getElementById(
                        "loginScreen"
                    );


                const appScreen =
                    document.getElementById(
                        "appScreen"
                    );


                if (
                    loginScreen
                ) {

                    loginScreen.classList.remove(
                        "hidden"
                    );

                }


                if (
                    appScreen
                ) {

                    appScreen.classList.add(
                        "hidden"
                    );

                }

            }

        })();

    </script>



    <!-- =================================================
         APP JS
    ================================================== -->

    <script
        type="module"
        src="./app.js"
    ></script>



    <!-- =================================================
         END BOOT
    ================================================== -->

    <script>

        window.addEventListener(
            "load",
            function () {

                document.documentElement
                    .classList
                    .remove(
                        "app-booting"
                    );

            }
        );


        /*
         * Fallback cho Safari / PWA
         */

        setTimeout(
            function () {

                document.documentElement
                    .classList
                    .remove(
                        "app-booting"
                    );

            },
            5000
        );

    </script>


</body>

</html>
