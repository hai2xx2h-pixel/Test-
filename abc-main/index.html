<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#e2e4e9">

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>

    <link rel="apple-touch-icon" href="icon.png">

    <title>员工码</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none; /* Cố định màn hình không cho vuốt */
        }

        input {
            touch-action: auto;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2f3347;
        }

        body {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            overscroll-behavior: none;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Text",
                "PingFang SC",
                "Helvetica Neue",
                STHeiti,
                sans-serif;

            background-image: url("background.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;

            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 💥 ĐÃ GIẢM CHIỀU CAO THANH TRẮNG XÁM PHÍA TRÊN NÀY BẠN NHÉ 💥 */
        .top-status-bar {
            width: 100%;
            height: 12px; /* Giảm từ 44px xuống 12px để không bị thô thừa */
            background-color: #e2e4e9;
            flex-shrink: 0;
        }

        /* ==================== MÀN HÌNH ĐĂNG NHẬP ==================== */
        #login-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-title {
            font-size: 20px;
            font-weight: 500;
            color: #F5D57F;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #E6DCBD;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #555;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            font-size: 15px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #f2c75b;
            color: #2f3347;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .login-btn:active {
            background: #dca738;
        }

        /* ==================== MÀN HÌNH CHÍNH (THẺ QR) ==================== */
        #main-screen {
            width: 100%;
            display: none; 
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        /* ĐẨY TIÊU ĐỀ TÊN NHÂN VIÊN LÊN SÁT ĐỈNH HƠN */
        .header {
            margin-top: 18px; /* Tinh chỉnh độ cao cho chuẩn tỉ lệ */
            font-size: 17px;
            color: #F5D57F;
            font-weight: 300;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .card {
            margin-top: 18px;
            width: 84%;
            max-width: 310px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background-color: #f2c75b;
            padding: 14px 8px;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 300;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .circle1,
        .circle2 {
            position: absolute;
            background-color: #2f3347;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            bottom: -6px;
            z-index: 10;
        }

        .circle1 { left: -6px; }
        .circle2 { right: -6px; }

        .card-body {
            background-color: #ffffff;
            padding: 16px 15px 14px 15px;
            text-align: center;
            color: #000;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time {
            font-size: 14px;
            font-weight: 300;
            color: #111111;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
            line-height: 1.2;
            width: 100%;
        }

        #qrcode {
            width: 220px;
            height: 220px;
            min-width: 220px;
            min-height: 220px;
            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        #qrcode img,
        #qrcode canvas {
            width: 220px !important;
            height: 220px !important;
            display: block !important;
        }

        .refresh {
            margin-top: 14px;
            width: 100%;

            display: flex;
            justify-content: center;
        }

        .refresh-title {
            cursor: pointer;
            font-size: 12px;
            color: #666666;
            font-weight: 300;
            -webkit-tap-highlight-color: transparent;
        }

        .status-box {
            margin-top: 12px;

            display: flex;
            flex-direction: column;
            align-items: center;

            color: #2eb85c;
        }

        .status-label {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;

            animation: pulse-green 1.2s infinite ease-in-out;
        }

        .status-timer {
            font-size: 18px;
            font-weight: 300;
            margin-top: 2px;
            letter-spacing: 0.5px;
            opacity: 1 !important;

            font-variant-numeric: tabular-nums;
        }

        @keyframes pulse-green {
            0% { opacity: 1; }
            50% { opacity: 0.25; }
            100% { opacity: 1; }
        }

        .note {
            margin: 20px 10% 0 10%;
            font-size: 13px;
            font-weight: 300;
            color: #E6DCBD;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="top-status-bar"></div>

    <!-- 1. MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
        <div class="login-box">
            <div class="login-title">员工通行码登录</div>
            <div class="input-group">
                <label for="empId">工号 (Mã NV):</label>
                <input type="text" id="empId" placeholder="VD: V25111639" />
            </div>
            <div class="input-group">
                <label for="empName">姓名 (Họ tên):</label>
                <input type="text" id="empName" placeholder="VD: Nguyễn Văn Hải" />
            </div>
            <button class="login-btn" onclick="handleLogin()">登录 (Đăng nhập)</button>
        </div>
    </div>

    <!-- 2. MÀN HÌNH CHÍNH HIỂN THỊ MÃ QR -->
    <div id="main-screen">
        <div class="header" id="userInfoHeader">
            --(--)
        </div>

        <div class="card">
            <div class="card-header" id="cardHeader">
                <span id="headerText">
                    将二维码对准扫描器刷码出场
                </span>
                <div class="circle1"></div>
                <div class="circle2"></div>
            </div>

            <div class="card-body">
                <div class="time" id="currentTime">--</div>

                <div id="qrcode"></div>

                <div class="refresh">
                    <span onclick="generateQRCode(event)" class="refresh-title">
                        刷新二维码
                    </span>
                </div>

                <div class="status-box">
                    <div class="status-label">已生效</div>
                    <div class="status-timer" id="statusTimer">00:00:00</div>
                </div>
            </div>
        </div>

        <div class="note">
            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
        </div>
    </div>


    <script>
        /* CHẶN SỰ KIỆN VUỐT / CUỘN */
        document.addEventListener('touchmove', function(e) {
            if (e.target.tagName !== 'INPUT') {
                e.preventDefault();
            }
        }, { passive: false });

        /* LOCALSTORAGE KEYS */
        const USER_STORAGE_KEY = "qr_employee_user";
        const TIMER_STORAGE_KEY = "qr_access_start_time";
        const COLOR_STORAGE_KEY = "qr_access_color";

        let currentEmployeeId = "";
        let currentEmployeeName = "";

        /* ĐĂNG NHẬP / KIỂM TRA MẠNG */
        function checkAuth() {
            if (!navigator.onLine) {
                forceLogout();
                return;
            }

            const savedUser = localStorage.getItem(USER_STORAGE_KEY);
            if (savedUser) {
                const userData = JSON.parse(savedUser);
                currentEmployeeId = userData.id;
                currentEmployeeName = userData.name;

                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-screen").style.display = "flex";

                document.getElementById("userInfoHeader").textContent = 
                    `${currentEmployeeId}(${currentEmployeeName})`;

                initApp();
            } else {
                document.getElementById("login-screen").style.display = "flex";
                document.getElementById("main-screen").style.display = "none";
            }
        }

        function handleLogin() {
            if (!navigator.onLine) {
                alert("Vui lòng bật mạng (Wi-Fi/4G) để đăng nhập!");
                return;
            }

            const idInput = document.getElementById("empId").value.trim();
            const nameInput = document.getElementById("empName").value.trim();

            if (!idInput || !nameInput) {
                alert("Vui lòng nhập đầy đủ Mã nhân viên và Họ tên!");
                return;
            }

            const userData = { id: idInput, name: nameInput };
            localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(userData));

            checkAuth();
        }

        function forceLogout() {
            localStorage.removeItem(USER_STORAGE_KEY);
            document.getElementById("login-screen").style.display = "flex";
            document.getElementById("main-screen").style.display = "none";
        }

        window.addEventListener("offline", function () {
            forceLogout();
        });

        /* HÀM ĐỒNG HỒ */
        function pad(num) {
            return num < 10 ? "0" + num : String(num);
        }

        let savedColor = localStorage.getItem(COLOR_STORAGE_KEY);
        let isGreen = savedColor === "green";

        const cardHeader = document.getElementById("cardHeader");
        const headerText = document.getElementById("headerText");

        function applyHeaderColor() {
            if (isGreen) {
                cardHeader.style.backgroundColor = "#38a754";
                headerText.textContent = "将二维码对准扫描器刷码进场";
            } else {
                cardHeader.style.backgroundColor = "#f2c75b";
                headerText.textContent = "将二维码对准扫描器刷码出场";
            }
        }

        let startTime = localStorage.getItem(TIMER_STORAGE_KEY);
        if (!startTime) {
            startTime = Date.now();
            localStorage.setItem(TIMER_STORAGE_KEY, String(startTime));
        } else {
            startTime = Number(startTime);
        }

        function updateAllTimers() {
            const now = new Date();

            const formattedTime =
                `${now.getFullYear()}-` +
                `${now.getMonth() + 1}-` +
                `${now.getDate()} ` +
                `${pad(now.getHours())}:` +
                `${pad(now.getMinutes())}:` +
                `${pad(now.getSeconds())}`;

            document.getElementById("currentTime").textContent = formattedTime;

            const elapsedSeconds = Math.max(0, Math.floor((Date.now() - startTime) / 1000));
            const hours = Math.floor(elapsedSeconds / 3600);
            const minutes = Math.floor((elapsedSeconds % 3600) / 60);
            const seconds = elapsedSeconds % 60;

            document.getElementById("statusTimer").textContent =
                `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        function resetTimer() {
            startTime = Date.now();
            localStorage.setItem(TIMER_STORAGE_KEY, String(startTime));
            document.getElementById("statusTimer").textContent = "00:00:00";
            updateAllTimers();
        }

        function toggleHeaderColor() {
            isGreen = !isGreen;
            localStorage.setItem(COLOR_STORAGE_KEY, isGreen ? "green" : "yellow");
            applyHeaderColor();
            resetTimer();
        }

        /* TẠO MÃ QR */
        function generateQRCode(event) {
            if (event && event.currentTarget) {
                event.currentTarget.blur();
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");

            const formattedTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            const uniqueToken = Math.random().toString(36).substring(2) + Date.now().toString(36);

            const accessData =
                `https://YOUR-AUTHORIZED-DOMAIN/access` +
                `?id=${encodeURIComponent(currentEmployeeId)}` +
                `&name=${encodeURIComponent(currentEmployeeName)}` +
                `&time=${encodeURIComponent(formattedTime)}` +
                `&token=${encodeURIComponent(uniqueToken)}`;

            const qrcodeElement = document.getElementById("qrcode");
            qrcodeElement.innerHTML = "";

            new QRCode(qrcodeElement, {
                text: accessData,
                width: 220,
                height: 220,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        /* NHẤN GIỮ ĐỔI MÀU */
        let pressTimer = null;
        const HOLD_DURATION = 5000;

        function startPress(e) {
            if (e.target.closest(".card") || e.target.closest(".top-status-bar") || e.target.closest("#login-screen") || e.target.tagName === 'INPUT') {
                return;
            }
            clearTimeout(pressTimer);
            pressTimer = setTimeout(() => {
                toggleHeaderColor();
            }, HOLD_DURATION);
        }

        function cancelPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        document.addEventListener("touchstart", startPress, { passive: true });
        document.addEventListener("touchend", cancelPress);
        document.addEventListener("touchcancel", cancelPress);
        document.addEventListener("mousedown", startPress);
        document.addEventListener("mouseup", cancelPress);
        document.addEventListener("mouseleave", cancelPress);

        /* KHỞI CHẠY */
        let timerInterval = null;

        function initApp() {
            applyHeaderColor();
            updateAllTimers();
            generateQRCode();

            if (!timerInterval) {
                timerInterval = setInterval(updateAllTimers, 1000);
            }
        }

        checkAuth();

    </script>
</body>
</html>
