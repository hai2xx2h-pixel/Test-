<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="theme-color"
        content="#2f3347"
    >


    <!-- =================================================
         BOOT
         Tránh hiện LOGIN chớp lên trước khi app khôi phục
    ================================================== -->

    <style>
        html.app-booting body {
            visibility: hidden;
        }
    </style>


    <!-- =================================================
         QR CODE
         GIỮ NGUYÊN
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"
    ></script>


    <link
        rel="apple-touch-icon"
        href="icon.png"
    >


    <link
        rel="stylesheet"
        href="styles.css"
    >


    <title>二维码通行</title>

</head>


<body>


    <!-- =================================================
         LOGIN SCREEN
    ================================================== -->

    <div
        id="loginScreen"
        class="login-screen"
    >

        <div class="login-box">

            <img
                src="Logo.jpg"
                class="login-logo"
                alt="Logo"
            >


            <div class="login-title">
                THOR
            </div>


            <div class="login-subtitle">
                员工身份验证
            </div>


            <input
                id="employeeCodeInput"
                class="employee-input"
                type="text"
                placeholder="请输入员工编号"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
            >


            <button
                id="loginButton"
                class="login-button"
                type="button"
            >
                确认
            </button>


            <div
                id="loginMessage"
                class="login-message"
            ></div>

        </div>

    </div>



    <!-- =================================================
         MAIN APP
    ================================================== -->

    <div
        id="appScreen"
        class="app-screen hidden"
    >


        <!-- =================================================
             NHÂN VIÊN
        ================================================== -->

        <div
            class="header"
            id="employeeHeader"
        >
            --
        </div>



        <!-- =================================================
             CARD
        ================================================== -->

        <div class="card">


            <!-- CARD HEADER -->

            <div
                class="card-header"
                id="cardHeader"
            >

                <span id="headerText">
                    将二维码对准扫描器刷码出场
                </span>


                <div class="circle1"></div>

                <div class="circle2"></div>

            </div>



            <!-- CARD BODY -->

            <div class="card-body">


                <!-- THỜI GIAN -->

                <div
                    class="time"
                    id="currentTime"
                >
                    --
                </div>



                <!-- =================================================
                     QR CODE
                     GIỮ NGUYÊN
                ================================================== -->

                <div id="qrcode"></div>



                <!-- =================================================
                     REFRESH QR
                ================================================== -->

                <div class="refresh">

                    <span
                        id="refreshQRCode"
                        class="refresh-title"
                    >
                        刷新二维码
                    </span>

                </div>



                <!-- =================================================
                     TIMER
                ================================================== -->

                <div class="status-box">

                    <div class="status-label">
                        已生效
                    </div>


                    <div
                        class="status-timer"
                        id="statusTimer"
                    >
                        00:00:00
                    </div>

                </div>


            </div>

        </div>



        <!-- =================================================
             NOTE
        ================================================== -->

        <div class="note">

            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。

        </div>


    </div>



    <!-- =================================================
         BOOTSTRAP
         
         Kiểm tra nhanh localStorage trước khi app.js
         chạy để tránh hiện màn hình LOGIN chớp lên.
    ================================================== -->

    <script>
        (function () {

            try {

                const employeeKey =
                    "thor_employee_id";

                const savedEmployee =
                    localStorage.getItem(
                        employeeKey
                    );


                const loginScreen =
                    document.getElementById(
                        "loginScreen"
                    );


                const appScreen =
                    document.getElementById(
                        "appScreen"
                    );


                /*
                 * Không có mạng:
                 * hiện LOGIN.
                 */

                if (
                    !navigator.onLine
                ) {

                    loginScreen.classList.remove(
                        "hidden"
                    );

                    appScreen.classList.add(
                        "hidden"
                    );

                }

                /*
                 * Có employee:
                 * tạm thời hiện APP.
                 *
                 * app.js sẽ kiểm tra Firebase
                 * và activeSession ngay sau đó.
                 */

                else if (
                    savedEmployee
                ) {

                    loginScreen.classList.add(
                        "hidden"
                    );

                    appScreen.classList.remove(
                        "hidden"
                    );

                }

                /*
                 * Chưa có employee:
                 * hiện LOGIN.
                 */

                else {

                    loginScreen.classList.remove(
                        "hidden"
                    );

                    appScreen.classList.add(
                        "hidden"
                    );
                }


            } catch (error) {

                console.error(
                    "BOOT ERROR:",
                    error
                );

            }

        })();
    </script>



    <!-- =================================================
         APP JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="./app.js"
    ></script>


    <!-- =================================================
         HIỆN TRANG SAU KHI BOOT
    ================================================== -->

    <script>
        /*
         * app.js sẽ xử lý việc chuyển LOGIN/APP.
         *
         * Ở đây chỉ bỏ trạng thái boot
         * sau khi DOM đã sẵn sàng.
         */

        window.addEventListener(
            "load",
            function () {

                document.documentElement
                    .classList
                    .remove("app-booting");

            }
        );
    </script>


</body>

</html>
