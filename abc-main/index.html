<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <!-- iPhone PWA -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <!-- STATUS BAR: NỀN SÁNG + ICON ĐEN -->
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <!-- MÀU HỆ THỐNG PHÍA TRÊN -->
    <meta
        name="theme-color"
        content="#f5f5f5"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="员工码"
    >

    <title>员工码</title>

    <link
        rel="apple-touch-icon"
        href="icon.png"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <script
        src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"
    ></script>
</head>


<body>

    <!-- =================================================
         LOGIN
    ================================================== -->

    <div
        id="loginScreen"
        class="login-screen"
    >

        <div class="login-box">

            <img
                src="icon.png"
                alt=""
                class="login-logo"
            >

            <div class="login-title">
                员工码
            </div>

            <div class="login-subtitle">
                请输入员工编号
            </div>

            <input
                id="employeeCodeInput"
                class="employee-input"
                type="text"
                placeholder="员工编号"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
            >

            <button
                id="loginButton"
                class="login-button"
                type="button"
            >
                登录
            </button>

            <div
                id="loginMessage"
                class="login-message"
            ></div>

        </div>

    </div>


    <!-- =================================================
         EMPLOYEE APP
    ================================================== -->

    <main
        id="appScreen"
        class="app-screen hidden"
    >

        <!-- EMPLOYEE NAME -->
        <div
            id="employeeHeader"
            class="header"
        ></div>


        <!-- =================================================
             CARD
        ================================================== -->

        <div class="card">

            <div
                id="cardHeader"
                class="card-header"
            >

                <span id="headerText">
                    将二维码对准扫描器刷码出场
                </span>

                <div class="circle1"></div>
                <div class="circle2"></div>

            </div>


            <div class="card-body">

                <!-- TIME -->
                <div
                    id="currentTime"
                    class="time"
                >
                    --
                </div>


                <!-- QR -->
                <div id="qrcode"></div>


                <!-- QR ACTIONS -->
                <div
                    id="qrActions"
                    class="refresh"
                >

                    <span
                        id="leaveAction"
                        class="leave-action hidden"
                    >
                        申请离场
                    </span>

                    <span
                        id="refreshQRCode"
                        class="refresh-title"
                    >
                        刷新二维码
                    </span>

                </div>


                <!-- STATUS -->
                <div class="status-box">

                    <div class="status-label">
                        已生效
                    </div>

                    <div
                        id="statusTimer"
                        class="status-timer"
                    >
                        00:00:00
                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             NOTE
        ================================================== -->

        <div class="note">
            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
        </div>


        <!-- GIỮ ELEMENT NÀY ĐỂ APP.JS KHÔNG LỖI -->
        <button
            id="logoutButton"
            class="logout-button"
            type="button"
        >
            退出登录
        </button>

    </main>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>

</html>
