<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="theme-color"
        content="#e2e4e9"
    >

    <link
        rel="apple-touch-icon"
        href="icon.png"
    >

    <title>二维码通行</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <div class="top-status-bar"></div>


    <!-- LOGIN -->

    <section
        id="loginScreen"
        class="login-screen"
    >

        <div class="login-box">

            <div class="login-logo">
                <img
                    src="Logo.jpg"
                    alt="Logo"
                >
            </div>


            <h1>
                THOR
            </h1>


            <p class="login-subtitle">
                员工身份验证
            </p>


            <input
                id="employeeCodeInput"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                placeholder="请输入员工编号"
            >


            <button
                id="loginButton"
            >
                确认
            </button>


            <div
                id="loginMessage"
                class="login-message"
            ></div>

        </div>

    </section>


    <!-- APP -->

    <main
        id="appScreen"
        class="app-screen hidden"
    >

        <div class="header">

            <span id="employeeHeader">
                --
            </span>

        </div>


        <div class="card">

            <div
                class="card-header"
                id="cardHeader"
            >

                <span id="headerText">
                    将二维码对准扫描器刷码出场
                </span>


                <div class="circle1"></div>
                <div class="circle2"></div>

            </div>


            <div class="card-body">

                <div
                    class="time"
                    id="currentTime"
                >
                    --
                </div>


                <div
                    id="qrcode"
                >
                    <div class="qr-placeholder">
                        QR DEMO
                    </div>
                </div>


                <div class="refresh">

                    <span
                        id="refreshButton"
                        class="refresh-title"
                    >
                        刷新二维码
                    </span>

                </div>


                <div class="status-box">

                    <div class="status-label">
                        已生效
                    </div>


                    <div
                        class="status-timer"
                        id="statusTimer"
                    >
                        00:00:00
                    </div>

                </div>

            </div>

        </div>


        <div class="note">

            <span id="userName">
                --
            </span>

            <br>

            <span id="accountStatus">
                --
            </span>

        </div>


        <button
            id="logoutButton"
            class="logout-button"
        >
            退出登录
        </button>

    </main>


    <script
        type="module"
        src="app.js"
    ></script>

</body>

</html>
