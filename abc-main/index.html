<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <!-- =================================================
         VIEWPORT
         viewport-fit=cover cần cho safe area trên iPhone
    ================================================== -->
    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >


    <!-- =================================================
         IOS PWA
    ================================================== -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >


    <!--
        QUAN TRỌNG:

        default =
        status bar sáng/trắng
        chữ + giờ + wifi + pin màu đen

        KHÔNG dùng black-translucent.
    -->
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >


    <!--
        Màu vùng giao diện hệ thống phía trên
    -->
    <meta
        name="theme-color"
        content="#f5f5f5"
    >


    <!-- =================================================
         APP NAME
    ================================================== -->
    <meta
        name="apple-mobile-web-app-title"
        content="员工码"
    >

    <title>员工码</title>


    <!-- =================================================
         ICON
    ================================================== -->
    <link
        rel="apple-touch-icon"
        href="icon.png"
    >


    <!-- =================================================
         CSS
    ================================================== -->
    <link
        rel="stylesheet"
        href="styles.css"
    >


    <!-- =================================================
         QR CODE LIBRARY
    ================================================== -->
    <script
        src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"
    ></script>
</head>


<body>


    <!-- =================================================
         LOGIN SCREEN
    ================================================== -->

    <div
        id="loginScreen"
        class="login-screen"
    >

        <div class="login-box">

            <img
                src="icon.png"
                alt=""
                class="login-logo"
            >


            <div class="login-title">
                员工码
            </div>


            <div class="login-subtitle">
                请输入员工编号
            </div>


            <input
                id="employeeCodeInput"
                class="employee-input"
                type="text"
                placeholder="员工编号"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
            >


            <button
                id="loginButton"
                class="login-button"
                type="button"
            >
                登录
            </button>


            <div
                id="loginMessage"
                class="login-message"
            ></div>

        </div>

    </div>



    <!-- =================================================
         EMPLOYEE APP
    ================================================== -->

    <main
        id="appScreen"
        class="app-screen hidden"
    >


        <!-- =============================================
             EMPLOYEE NAME

             JS sẽ tự đưa:
             Vxxxxxxx(Tên nhân viên)

             KHÔNG hard-code dữ liệu ảnh mẫu.
        ============================================== -->

        <div
            id="employeeHeader"
            class="header"
        ></div>



        <!-- =============================================
             QR CARD
        ============================================== -->

        <div class="card">


            <!-- =========================================
                 CARD HEADER
            ========================================== -->

            <div
                id="cardHeader"
                class="card-header"
            >

                <span id="headerText">
                    将二维码对准扫描器刷码出场
                </span>


                <div class="circle1"></div>

                <div class="circle2"></div>

            </div>



            <!-- =========================================
                 CARD BODY
            ========================================== -->

            <div class="card-body">


                <!-- CURRENT TIME -->

                <div
                    id="currentTime"
                    class="time"
                >
                    -- 
                </div>



                <!-- QR -->

                <div id="qrcode"></div>



                <!-- =====================================
                     QR ACTIONS

                     YELLOW:
                         刷新二维码

                     GREEN:
                         申请离场   刷新二维码
                ====================================== -->

                <div
                    id="qrActions"
                    class="refresh"
                >

                    <span
                        id="leaveAction"
                        class="leave-action hidden"
                    >
                        申请离场
                    </span>


                    <span
                        id="refreshQRCode"
                        class="refresh-title"
                    >
                        刷新二维码
                    </span>

                </div>



                <!-- =====================================
                     STATUS
                ====================================== -->

                <div class="status-box">

                    <div class="status-label">
                        已生效
                    </div>


                    <div
                        id="statusTimer"
                        class="status-timer"
                    >
                        00:00:00
                    </div>

                </div>

            </div>

        </div>



        <!-- =============================================
             SECURITY NOTE
        ============================================== -->

        <div class="note">
            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
        </div>



        <!-- =============================================
             LOGOUT

             Giữ element để app.js cũ không lỗi.
             CSS + JS đều ẩn nó.
        ============================================== -->

        <button
            id="logoutButton"
            class="logout-button"
            type="button"
        >
            退出登录
        </button>

    </main>



    <!-- =================================================
         APP JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>

</html>
