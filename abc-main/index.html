<!DOCTYPE html>
<html lang="zh" class="app-booting">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    >

    <meta name="theme-color" content="#e4e5ea">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="员工码"
    >

    <title>员工码</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>


<body>

    <!-- =====================================================
         LOGIN SCREEN
    ====================================================== -->

    <div
        id="loginScreen"
        class="login-screen"
    >

        <div class="login-box">

            <img
                src="logo.png"
                class="login-logo"
                alt="Logo"
            >

            <div class="login-title">
                THOR
            </div>

            <div class="login-subtitle">
                员工身份验证
            </div>

            <input
                id="employeeCodeInput"
                class="employee-input"
                type="text"
                placeholder="请输入员工编号"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="characters"
                spellcheck="false"
            >

            <button
                id="loginButton"
                class="login-button"
                type="button"
            >
                确认
            </button>

            <div
                id="loginMessage"
                class="login-message"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         EMPLOYEE APP
    ====================================================== -->

    <div
        id="appScreen"
        class="app-screen hidden"
    >

        <!-- Employee ID + Name -->
        <div
            id="employeeHeader"
            class="header"
        >
            --
        </div>


        <!-- =================================================
             MAIN CARD
        ================================================== -->

        <div class="card">


            <!-- =============================================
                 CARD HEADER
            ============================================== -->

            <div
                id="cardHeader"
                class="card-header"
            >

                <span id="headerText">
                    将二维码对准扫描器刷码出场
                </span>

                <span class="circle1"></span>
                <span class="circle2"></span>

            </div>


            <!-- =============================================
                 CARD BODY
            ============================================== -->

            <div class="card-body">


                <!-- Current Date / Time -->

                <div
                    id="currentTime"
                    class="time"
                >
                    ----
                </div>


                <!-- QR -->

                <div id="qrcode"></div>


                <!-- =========================================
                     ACTION ROW

                     YELLOW:
                     刷新二维码

                     GREEN:
                     申请离场    刷新二维码
                ========================================== -->

                <div
                    id="qrActions"
                    class="refresh"
                >

                    <!--
                        ẨN mặc định.

                        app.js sẽ hiện mục này
                        khi trạng thái chuyển sang GREEN.
                    -->

                    <span
                        id="leaveAction"
                        class="leave-action hidden"
                    >
                        申请离场
                    </span>


                    <span
                        id="refreshQRCode"
                        class="refresh-title"
                    >
                        刷新二维码
                    </span>

                </div>


                <!-- =========================================
                     STATUS
                ========================================== -->

                <div class="status-box">

                    <div
                        id="statusLabel"
                        class="status-label"
                    >
                        已生效
                    </div>

                    <div
                        id="statusTimer"
                        class="status-timer"
                    >
                        00:00:00
                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             SECURITY NOTE
        ================================================== -->

        <div class="note">
            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
        </div>


        <!-- Logout luôn ẩn -->
        <button
            id="logoutButton"
            class="logout-button"
            type="button"
        >
            退出登录
        </button>

    </div>


    <!-- =====================================================
         QR CODE LIBRARY
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"
    ></script>


    <!-- =====================================================
         APP
    ====================================================== -->

    <script type="module" src="app.js"></script>


    <!-- =====================================================
         QUICK BOOT
         Có cache thì hiện APP trước để tránh nháy login.
         app.js vẫn kiểm tra Firebase sau đó.
    ====================================================== -->

    <script>
        (function () {

            try {

                const employeeId =
                    localStorage.getItem(
                        "thor_employee_id"
                    );

                const loginScreen =
                    document.getElementById(
                        "loginScreen"
                    );

                const appScreen =
                    document.getElementById(
                        "appScreen"
                    );


                if (
                    employeeId &&
                    navigator.onLine
                ) {

                    if (loginScreen) {
                        loginScreen.classList.add(
                            "hidden"
                        );
                    }

                    if (appScreen) {
                        appScreen.classList.remove(
                            "hidden"
                        );
                    }

                }

            } catch (error) {

                console.warn(
                    "Boot cache error:",
                    error
                );

            }


            window.addEventListener(
                "load",
                function () {

                    document
                        .documentElement
                        .classList
                        .remove(
                            "app-booting"
                        );

                }
            );


            setTimeout(
                function () {

                    document
                        .documentElement
                        .classList
                        .remove(
                            "app-booting"
                        );

                },
                5000
            );

        })();
    </script>

</body>

</html>
